# NCache Cache Server Deployment
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ncache
  labels:
    app: ncache
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ncache
  template:
    metadata:
      labels:
        app: ncache
    spec:
      nodeSelector:
        "kubernetes.io/os": linux
      env:
        NC_KEY: "${NCACHE_KEY}"
      containers:
      - name: ncache
        image: ${IMAGE_REPOSITORY}:${IMAGE_TAG}
        #resources:
        #  limits:
        #    memory: "200Mi"
        #    cpu: "2"
        #  requests:
        #    memory: "100Mi"
        #    cpu: "1"
        ports:
        - name: client-tcp
          containerPort: 9800
        - name: management-http
          containerPort: 9801
        - name: management-tcp
          containerPort: 9803
        - name: bridge-client
          containerPort: 9816
        - name: bridge-management
          containerPort: 9817
