# Headless Service for auto discovery of cache server nodes for client applications
kind: Service
apiVersion: v1 # depends on the underlying Kubernetes version
metadata:
  name: cacheserver
  labels:
    app: cacheserver
spec:
  clusterIP: None
  selector:
    app: ncache # same label as provided in the ncache.yaml file
  ports:
  - name: management-tcp
    port: 9803
    targetPort: 9803
  - name: client-port
    port: 9800
    targetPort: 9800